apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodejsdemo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nodejsdemo
  template:
    metadata:
      labels:
        app: nodejsdemo
    spec:
      containers:
      - name: nodejsdemo
        image: acrvotingapp7f7e43aa.azurecr.io/nodejs-demoapp:latest
        ports:
        - containerPort: 3000
        env:
        - name: PORT
          value: "3000"
---
apiVersion: v1
kind: Service
metadata:
  name: nodejsdemo
spec:
  ports:
  - port: 80
    targetPort: 3000
  selector:
    app: nodejsdemo
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nodejsdemo
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - host: staging.57.162.154.139.nip.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: nodejsdemo
            port:
              number: 80
